name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Evaluation harness (fails on regression against eval/baseline.json)
        run: npm run eval:check
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: eval/results.json
